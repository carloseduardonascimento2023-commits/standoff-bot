name: Bot Standoff

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ffmpeg
          pip install requests pytesseract pillow yt-dlp

      - name: Rodar bot
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_KEY: ${{ secrets.CALLMEBOT_KEY }}
        run: python bot.py

      - name: Salvar vídeos já vistos
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add vistos.json
          git diff --staged --quiet || (git commit -m "atualiza vistos" && git push)
